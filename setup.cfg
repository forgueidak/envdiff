[metadata]
name = envdiff
version = 0.1.0
description = Compares .env files across environments and reports missing or mismatched keys with optional secret masking.
long_description = file: README.md
long_description_content_type = text/markdown
author = envdiff contributors
license = MIT
python_requires = >=3.11

[options]
packages = find:
package_dir =
    = .

[options.packages.find]
where = .
include = envdiff*

[options.entry_points]
console_scripts =
    envdiff = envdiff.cli:main

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov

[tool:pytest]
testpaths = tests
addopts = --tb=short

[flake8]
max-line-length = 99
exclude = .git,__pycache__,.venv
